name: Build MesHeures APK V20.4.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MESHEURES_VERSION: "20.4.0"
      MESHEURES_VERSION_CODE: "2040"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Static version + runtime audit
        run: python3 qa/version-audit.py

      - name: JavaScript syntax audit
        run: |
          set -e
          find app/src/main/assets/web/scripts -name '*.js' -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
          done

      - name: Prepare persistent signing key
        if: ${{ secrets.MESHEURES_KEYSTORE_B64 != '' }}
        env:
          MESHEURES_KEYSTORE: ${{ github.workspace }}/mesheures-release.keystore
        run: echo "${{ secrets.MESHEURES_KEYSTORE_B64 }}" | base64 --decode > "$MESHEURES_KEYSTORE"

      - name: Build release APK
        env:
          MESHEURES_KEYSTORE: ${{ github.workspace }}/mesheures-release.keystore
          MESHEURES_STORE_PASSWORD: ${{ secrets.MESHEURES_STORE_PASSWORD }}
          MESHEURES_KEY_PASSWORD: ${{ secrets.MESHEURES_KEY_PASSWORD }}
          MESHEURES_KEY_ALIAS: ${{ secrets.MESHEURES_KEY_ALIAS }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify built APK version
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -F "versionCode='2040'" /tmp/apk-badging.txt
          grep -F "versionName='20.4.0'" /tmp/apk-badging.txt
          grep -F "package: name='com.mesheures.app'" /tmp/apk-badging.txt

      - name: Publish versioned APK
        run: cp app/build/outputs/apk/release/app-release.apk "MesHeures-APK-release-v20.4.0.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: MesHeures-APK-release-v20.4.0
          path: MesHeures-APK-release-v20.4.0.apk
          if-no-files-found: error
