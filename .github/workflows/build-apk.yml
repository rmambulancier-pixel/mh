name: Build MesHeures APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare persistent signing key
        env:
          MESHEURES_KEYSTORE: ${{ github.workspace }}/mesheures-release.keystore
        run: |
          echo "${{ secrets.MESHEURES_KEYSTORE_B64 }}" | base64 --decode > "$MESHEURES_KEYSTORE"
      - name: Build signed release APK
        env:
          MESHEURES_KEYSTORE: ${{ github.workspace }}/mesheures-release.keystore
          MESHEURES_STORE_PASSWORD: ${{ secrets.MESHEURES_STORE_PASSWORD }}
          MESHEURES_KEY_PASSWORD: ${{ secrets.MESHEURES_KEY_PASSWORD }}
          MESHEURES_KEY_ALIAS: ${{ secrets.MESHEURES_KEY_ALIAS }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MesHeures-APK-release-v18.0.17
          path: app/build/outputs/apk/release/app-release.apk
