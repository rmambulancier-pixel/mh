name: build

on:
  push:
    branches: [main, v30.0.2-clean]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          CODE="$(grep '^VERSION_CODE=' version.properties | cut -d= -f2)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Release: $VERSION ($CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Export dynamic release version
        run: |
          echo "MESHEURES_VERSION=${{ steps.version.outputs.version }}" >> "$GITHUB_ENV"
          echo "MESHEURES_VERSION_CODE=${{ steps.version.outputs.code }}" >> "$GITHUB_ENV"

      - name: Static release audit
        run: python3 qa/release-audit.py

      - name: Performance architecture audit
        run: python3 qa/performance-audit.py

      - name: JavaScript syntax audit
        shell: bash
        run: |
          find app/src/main/assets/web -type f -name '*.js' -print0 |
            xargs -0 -n1 node --check

      - name: Prepare persistent signing key
        shell: bash
        env:
          MESHEURES_KEYSTORE_B64: ${{ secrets.MESHEURES_KEYSTORE_B64 }}
          MESHEURES_STORE_PASSWORD: ${{ secrets.MESHEURES_STORE_PASSWORD }}
          MESHEURES_KEY_PASSWORD: ${{ secrets.MESHEURES_KEY_PASSWORD }}
          MESHEURES_KEY_ALIAS: ${{ secrets.MESHEURES_KEY_ALIAS }}
        run: |
          echo "$MESHEURES_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mesheures-release.jks"
          echo "MESHEURES_KEYSTORE=$RUNNER_TEMP/mesheures-release.jks" >> "$GITHUB_ENV"
          echo "MESHEURES_STORE_PASSWORD=$MESHEURES_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MESHEURES_KEY_PASSWORD=$MESHEURES_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "MESHEURES_KEY_ALIAS=$MESHEURES_KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        run: |
          # gradle.properties contient l'override AAPT2 ARM64 pour Termux.
          # GitHub Actions est en x86_64 : on le retire uniquement pour CI.
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties
          gradle :app:assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep "versionName='${{ steps.version.outputs.version }}'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep "versionCode='${{ steps.version.outputs.code }}'"

      - name: Publish APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: MesHeures-${{ steps.version.outputs.version }}-${{ steps.version.outputs.code }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
