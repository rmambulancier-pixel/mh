plugins { id 'com.android.application' }

android {
    namespace 'com.mesheures.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mesheures.app'
        minSdk 26
        targetSdk 35
        versionCode 1818
        versionName '18.0.18'
    }
    signingConfigs {
        release {
            def ks = System.getenv('MESHEURES_KEYSTORE')
            def sp = System.getenv('MESHEURES_STORE_PASSWORD')
            def kp = System.getenv('MESHEURES_KEY_PASSWORD')
            def alias = System.getenv('MESHEURES_KEY_ALIAS')
            if (ks && sp && kp && alias) {
                storeFile = file(ks)
                storePassword = sp
                keyAlias = alias
                keyPassword = kp
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('MESHEURES_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies { implementation 'androidx.core:core:1.15.0' }
