plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.mesheures.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mesheures.app'
        minSdk 26
        targetSdk 35
        versionCode 1900
        versionName '19.0.0'
    }
    signingConfigs {
        release {
            def ks = System.getenv('MESHEURES_KEYSTORE')
            def sp = System.getenv('MESHEURES_STORE_PASSWORD')
            def kp = System.getenv('MESHEURES_KEY_PASSWORD')
            def alias = System.getenv('MESHEURES_KEY_ALIAS')
            if (ks && sp && kp && alias) {
                storeFile = file(ks)
                storePassword = sp
                keyAlias = alias
                keyPassword = kp
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('MESHEURES_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
